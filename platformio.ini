[env:esp32-s3-n16r8]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; ===== PORT CONFIG (IMPORTANT) =====
upload_port   = COM5          ; use USB-to-UART for flashing
monitor_port  = COM3          ; use native USB CDC for logs (optional)

; ===== SPEED =====
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

; ===== UPLOAD =====
upload_protocol = esptool

; ===== BUILD FLAGS =====
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM

; ===== MEMORY CONFIG =====
board_build.arduino.memory_type = qio_opi
board_build.partitions          = default_16MB.csv
board_build.flash_size          = 16MB
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 16MB

; ===== LIBRARIES =====
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.14
    adafruit/Adafruit GFX Library @ ^1.12.5