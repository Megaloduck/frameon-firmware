[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; ── Serial monitor ────────────────────────────────────────────────────────────
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; ── Build flags ───────────────────────────────────────────────────────────────
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; HUB75 panel geometry — must match your physical panel
    -DPANEL_WIDTH=64
    -DPANEL_HEIGHT=32
    -DCHAIN_LENGTH=1
    ; MatrixPanel-DMA double-buffer for tear-free updates
    -DDOUBLE_BUFFER=1
    ; BLE: limit connections to 1 to save heap
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    ; FreeRTOS task stack sizes (bytes)
    -DBLE_TASK_STACK=8192
    -DDISPLAY_TASK_STACK=4096

; ── Libraries ─────────────────────────────────────────────────────────────────
lib_deps =
    ; HUB75 DMA driver (supports ESP32-S3 natively)
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git
    ; NimBLE — much lighter BLE stack, ~40 % less heap than the built-in lib
    h2zero/NimBLE-Arduino @ ^1.4.2

; ── Partition scheme ──────────────────────────────────────────────────────────
; huge_app: ~3 MB for code.  Needed for NimBLE + DMA frame buffers.
board_build.partitions = huge_app.csv

; ── Upload ────────────────────────────────────────────────────────────────────
upload_speed = 921600